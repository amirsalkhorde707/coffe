<style>
:root{--primary:#D4A373;--secondary:#FAEDCD;--dark:#333333;--cream:#FEFAE0;--s1:8px;--s2:16px;--s3:24px;--s4:32px;--r1:12px;--r2:20px;--shadow:0 8px 24px #33333312;--shadow-hover:0 14px 32px #33333320}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:142px}body{margin:0;background:var(--cream);color:var(--dark);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}a{color:inherit}button{font:inherit}.wrap{width:min(100% - 32px,640px);margin-inline:auto}
.site-header{position:sticky;top:0;z-index:5;background:#FEFAE0eF;border-bottom:1px solid #3333330a;transition:background .25s ease,box-shadow .25s ease,backdrop-filter .25s ease}.site-header.scrolled{background:#FEFAE0d9;backdrop-filter:blur(14px);box-shadow:0 4px 20px #33333312}.header-inner{min-height:76px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--secondary);font-size:25px;flex:none}.brand h1{font-size:19px;line-height:1.35;margin:0;font-weight:800}.brand p{font-size:12px;color:#6d655a;margin:3px 0 0}.hero{padding:var(--s3) 0 var(--s2)}.hero-card{padding:22px 20px;border-radius:var(--r2);background:linear-gradient(125deg,#D4A373,#e8c49c 62%,#FAEDCD);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-card:after{content:"☕";position:absolute;left:18px;bottom:-24px;font-size:98px;opacity:.13;transform:rotate(-14deg)}.hero-card h2{font-size:20px;margin:0 0 4px}.hero-card p{margin:0 0 14px;font-size:14px;max-width:80%}.hours{display:inline-flex;align-items:center;gap:6px;background:#fff9e8d9;border:1px solid #fff9e8;border-radius:30px;padding:5px 12px;font-size:12px;font-weight:600}.menu-nav{position:sticky;top:76px;z-index:4;background:#FEFAE0eF;backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid #3333330a}.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #e4d8c4;border-radius:999px;background:#fffaf0;color:#514b42;white-space:nowrap;padding:8px 15px;font-size:13px;cursor:pointer;transition:background .25s ease,color .25s ease,border-color .25s ease,transform .25s ease;min-height:42px}.tab:hover{border-color:var(--primary)}.tab[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 4px 12px #33333320}.tab:active,.contact:active{transform:scale(.97)}:focus-visible{outline:3px solid #8a572b;outline-offset:3px}.menu-section{padding:var(--s3) 0 52px}.section-title{font-size:19px;margin:0 0 16px}.menu-grid{display:grid;grid-template-columns:1fr;gap:14px}.menu-card{background:#fffdf7;border:1px solid #3333330a;border-radius:var(--r1);overflow:hidden;box-shadow:var(--shadow);transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease;opacity:0;transform:translateY(12px)}.menu-card.revealed{opacity:1;transform:translateY(0)}.menu-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}.menu-card.is-hidden{display:none}.item-art{height:112px;display:grid;place-items:center;background:linear-gradient(135deg,#FAEDCD,#f3dfbd 55%,#e8c49c);font-size:48px}.item-content{padding:14px 16px 15px}.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.item-name{font-size:16px;font-weight:750;margin:0}.badge{font-size:10px;line-height:1.5;padding:3px 9px;border-radius:20px;background:#f3e3c8;color:#70461f;white-space:nowrap}.badge.new{background:#e5efdf;color:#38543b}.item-desc{font-size:12px;color:#70695f;margin:5px 0 13px;min-height:24px}.item-bottom{border-top:1px solid #3333330d;padding-top:10px;display:flex;justify-content:flex-end;align-items:baseline;gap:5px;font-size:12px;color:#71665a}.price{font-size:15px;font-weight:800;color:#69451f}.site-footer{background:#333;color:#f8f0df;padding:26px 0 18px}.footer-grid{display:grid;gap:8px;font-size:13px}.footer-grid p{margin:0}.footer-grid a{text-decoration:none}.footer-grid a:hover{text-decoration:underline}.credit{border-top:1px solid #ffffff22;margin-top:20px;padding-top:12px;text-align:center;color:#c9beac;font-size:11px}.contact{position:fixed;bottom:18px;left:16px;z-index:6;display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;background:var(--dark);color:#fff;text-decoration:none;font-size:13px;font-weight:650;box-shadow:0 6px 18px #0003;transition:transform .25s ease,background .25s ease}.contact:hover{background:#60492f;transform:translateY(-2px)}
@media(min-width:640px){.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.hero-card{padding:26px 28px}.hero-card h2{font-size:22px}.menu-section{padding-top:28px}.footer-grid{grid-template-columns:1fr 1fr;column-gap:24px}}
@media(hover:none){.menu-card:hover{transform:none;box-shadow:var(--shadow)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}.menu-card{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="site-header" id="siteHeader"><div class="wrap header-inner"><div class="logo" aria-hidden="true">☕</div><div class="brand"><h1>کافه چی</h1><p>بهترین و پرفروش ترین کافه ی منطقه </p></div></div></header>
<main>
<section class="hero wrap" aria-label="خوش‌آمدگویی"><div class="hero-card"><h2>لحظه‌ای برای خودت ☀️</h2><p>به کافه چی  خوش آمدید؛ عطر قهوه و حال خوب منتظر شماست.</p><span class="hours">◷ ساعت کاری: ۹ صبح تا ۱۲ شب</span></div></section>
<nav class="menu-nav" aria-label="دسته‌بندی منو"><div class="wrap tabs" role="group" aria-label="فیلتر دسته‌بندی منو"><button class="tab" type="button" data-category="همه" aria-label="نمایش همه آیتم‌ها" aria-pressed="true">همه</button><button class="tab" type="button" data-category="قهوه گرم" aria-label="فیلتر قهوه گرم" aria-pressed="false">قهوه گرم</button><button class="tab" type="button" data-category="نوشیدنی سرد" aria-label="فیلتر نوشیدنی سرد" aria-pressed="false">نوشیدنی سرد</button><button class="tab" type="button" data-category="کیک و دسر" aria-label="فیلتر کیک و دسر" aria-pressed="false">کیک و دسر</button><button class="tab" type="button" data-category="صبحانه" aria-label="فیلتر صبحانه" aria-pressed="false">صبحانه</button></div></nav>
<section class="menu-section wrap" aria-labelledby="menuTitle"><h2 class="section-title" id="menuTitle">منوی کافه چی </h2><div class="menu-grid" id="menuGrid" aria-live="polite"></div></section>
</main>
<footer class="site-footer"><div class="wrap"><div class="footer-grid"><p></p><p> <a href="tel:+982188776655" aria-label="تماس با کافه چی "></a></p><p>اینستاگرام: <a href="https://instagram.com/delgosha.cafe" target="_blank" rel="noopener noreferrer" aria-label="اینستاگرام کافه چی ">@delgosha.cafe</a></p></div><div class="credit">طراحی و توسعه: امیر علی سالخورده </div></div></footer>
<a class="contact" href="tel:+982188776655" aria-label="تماس با ما، ۰۲۱-۸۸۷۷۶۶۵۵">☎ تماس با ما</a>
<script>
// داده‌های منو و رندر پویا برای نگهداری ساده‌تر محتوا
const menuItems=[
{category:'قهوه گرم',name:'اسپرسو',desc:'قهوه‌ای غلیظ با عطر ماندگار',price:85000,emoji:'☕',badge:'پرفروش'},
{category:'قهوه گرم',name:'لاته',desc:'اسپرسو با شیر بخارداده‌شده و فوم لطیف',price:135000,emoji:'🥛'},
{category:'قهوه گرم',name:'کاپوچینو',desc:'ترکیب متعادل اسپرسو، شیر و فوم',price:125000,emoji:'☕'},
{category:'قهوه گرم',name:'موکا',desc:'اسپرسو، شکلات و شیر گرم',price:145000,emoji:'🍫',badge:'جدید'},
{category:'نوشیدنی سرد',name:'آیس لاته',desc:'اسپرسو و شیر خنک روی یخ',price:145000,emoji:'🧋',badge:'پرفروش'},
{category:'نوشیدنی سرد',name:'آیس آمریکانو',desc:'اسپرسو دوبل با آب خنک و یخ',price:115000,emoji:'🧊'},
{category:'نوشیدنی سرد',name:'لیموناد',desc:'لیموترش تازه، نعناع و خنکی',price:110000,emoji:'🍋',badge:'جدید'},
{category:'کیک و دسر',name:'چیزکیک',desc:'چیزکیک لطیف با سس میوه فصل',price:155000,emoji:'🍰',badge:'پرفروش'},
{category:'کیک و دسر',name:'براونی شکلاتی',desc:'براونی گرم با شکلات تلخ',price:125000,emoji:'🍫'},
{category:'صبحانه',name:'صبحانه ایرانی',desc:'نان تازه، پنیر، گردو، سبزی و چای',price:220000,emoji:'🍳',badge:'پرفروش'},
{category:'صبحانه',name:'پنکیک عسل',desc:'پنکیک خانگی با عسل و میوه فصل',price:185000,emoji:'🥞',badge:'جدید'}
];
const grid=document.getElementById('menuGrid');
const persianNumber=value=>String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
let revealObserver;
if('IntersectionObserver'in window){revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('revealed');revealObserver.unobserve(entry.target)}}),{threshold:.08})}
function renderMenu(category='همه'){
 const visible=menuItems.filter(item=>category==='همه'||item.category===category);
 grid.innerHTML=visible.map((item,index)=>`<article class="menu-card" style="transition-delay:${Math.min(index*35,140)}ms"><div class="item-art" aria-hidden="true">${item.emoji}</div><div class="item-content"><div class="item-top"><h3 class="item-name">${item.name}</h3>${item.badge?`<span class="badge ${item.badge==='جدید'?'new':''}">${item.badge}</span>`:''}</div><p class="item-desc">${item.desc}</p><div class="item-bottom"><span class="price">${persianNumber(item.price.toLocaleString('en-US'))}</span><span>تومان</span></div></div></article>`).join('');
 grid.querySelectorAll('.menu-card').forEach(card=>revealObserver?revealObserver.observe(card):card.classList.add('revealed'));
}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(button=>button.setAttribute('aria-pressed',String(button===tab)));
 renderMenu(tab.dataset.category);
}));
const header=document.getElementById('siteHeader');
function updateHeader(){header.classList.toggle('scrolled',window.scrollY>8)}
window.addEventListener('scroll',updateHeader,{passive:true});updateHeader();renderMenu();
</script>
