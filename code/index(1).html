<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6F4E37">
<meta name="description" content="منوی دیجیتال کافه چی">
<title>منوی کافه چی</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#FBF6EE;--surface:#FFFFFF;--ink:#2A2019;--muted:#7D6D5D;
  --brand:#6F4E37;--brand-2:#A9744A;--caramel:#C8894A;--cream:#F3E6CF;--line:#EBE0CE;
  --r:20px;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 12px 28px -14px rgba(77,52,28,.28);
  --shadow-lg:0 2px 4px rgba(60,40,20,.06),0 26px 46px -18px rgba(77,52,28,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:160px}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 105% -10%,#F1D9B3 0,transparent 60%),
    radial-gradient(700px 480px at -15% 35%,#EAD0A6 0,transparent 55%);
  opacity:.8;
}
a{color:inherit}
button{font:inherit}
img{display:block}
:focus-visible{outline:3px solid var(--caramel);outline-offset:3px;border-radius:10px}
.wrap{width:min(100% - 32px,1120px);margin-inline:auto}

/* ---------- Header ---------- */
.site-header{
  position:sticky;top:0;z-index:20;
  background:rgba(251,246,238,.82);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;
}
.site-header.scrolled{border-color:var(--line);box-shadow:0 10px 28px -18px rgba(77,52,28,.45)}
.header-inner{min-height:76px;display:flex;align-items:center;gap:14px}
.logo{
  width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:24px;
  box-shadow:0 10px 22px -10px var(--brand);
}
.brand h1{margin:0;font-size:20px;font-weight:800;line-height:1.3}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.open-badge{
  margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;color:#2f6a3c;background:#e4f2e0;padding:6px 13px;border-radius:99px;
}
.open-badge::before{
  content:"";width:8px;height:8px;border-radius:50%;background:#3fa35a;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3fa35a66}70%{box-shadow:0 0 0 8px #3fa35a00}100%{box-shadow:0 0 0 0 #3fa35a00}}

/* ---------- Banner ---------- */
.hero{padding:22px 0 6px}
.hero-card{
  position:relative;overflow:hidden;border-radius:28px;padding:26px 22px;color:#fff;
  background:linear-gradient(120deg,var(--brand) 0%,#8E5F3D 55%,var(--caramel) 120%);
  box-shadow:var(--shadow-lg);
  display:grid;gap:22px;align-items:center;
}
.hero-card::before{
  content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,#ffffff26,transparent 70%);top:-160px;left:-80px;pointer-events:none;
}
.eyebrow{
  display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;
  background:#ffffff26;border:1px solid #ffffff38;margin-bottom:10px;
}
.hero-text{position:relative}
.hero-text h2{margin:0 0 6px;font-size:27px;font-weight:800;line-height:1.5}
.hero-text p{margin:0 0 20px;max-width:520px;opacity:.93;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:99px;
  background:#ffffff1f;border:1px solid #ffffff3a;font-size:13px;font-weight:600;text-decoration:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s;
}
.chip:hover{background:#ffffff38}
.hero-media{
  position:relative;margin:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;
  box-shadow:0 20px 40px -18px #2a1a0e99;border:4px solid #ffffff2e;
}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center}

/* ---------- Tabs ---------- */
.menu-nav{
  position:sticky;top:76px;z-index:15;padding:14px 0 12px;
  background:linear-gradient(var(--bg) 75%,rgba(251,246,238,0));
}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;min-height:44px;padding:9px 20px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:14px;font-weight:600;box-shadow:0 2px 6px -4px rgba(77,52,28,.35);
  transition:background .25s,color .25s,border-color .25s,transform .25s,box-shadow .25s;
}
.tab:hover{border-color:var(--caramel);transform:translateY(-1px)}
.tab:active{transform:scale(.97)}
.tab[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;
  box-shadow:0 12px 22px -12px var(--brand);
}

/* ---------- Menu ---------- */
.menu{padding:8px 0 64px}
.group{margin-top:34px}
.group-head{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.group-icon{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:22px;
}
.group-title{margin:0;font-size:22px;font-weight:800;line-height:1.3}
.group-count{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.card{
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease;
  animation:rise .6s var(--d,0ms) cubic-bezier(.2,.7,.2,1) both;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.art{
  position:relative;aspect-ratio:1/1;display:grid;place-items:center;padding:14px;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#fff 0,#F8EEDC 68%,#F1E2C8 100%);
}
.art img{
  width:100%;height:100%;object-fit:contain;transition:transform .5s ease;
  filter:drop-shadow(0 12px 14px rgba(77,52,28,.2));
}
.card:hover .art img{transform:scale(1.05)}
.emo{font-size:68px;line-height:1;filter:drop-shadow(0 8px 10px rgba(77,52,28,.2));transition:transform .5s ease}
.card:hover .emo{transform:scale(1.08)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.name{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.foot{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-top:1px dashed var(--line);padding-top:10px;
}
.price{font-weight:800;color:var(--brand);font-size:15px;white-space:nowrap}
.price small{font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:4px}
.price.soon{color:var(--muted);font-weight:600;font-size:13px}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--cream);color:#7a4f25;white-space:nowrap}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Footer ---------- */
.site-footer{background:var(--ink);color:#F5E9D3;padding:38px 0 28px;margin-top:24px}
.footer-grid{display:grid;gap:12px;text-align:center;font-size:14px}
.footer-grid a{text-decoration:none;font-weight:700}
.footer-grid a:hover{text-decoration:underline}
.credit{margin-top:24px;padding-top:16px;border-top:1px solid #ffffff1a;text-align:center;color:#b9a994;font-size:12px}

/* ---------- Floating contact ---------- */
.contact{
  position:fixed;bottom:18px;left:16px;z-index:30;display:flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:99px;text-decoration:none;color:#fff;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,var(--brand),var(--caramel));box-shadow:0 14px 28px -12px var(--brand);
  transition:transform .3s ease;
}
.contact:hover{transform:translateY(-3px)}
.contact:active{transform:scale(.97)}

/* ---------- Desktop ---------- */
@media(min-width:720px){
  .hero-card{grid-template-columns:1.1fr .9fr;padding:44px 42px;gap:36px}
  .hero-text h2{font-size:36px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .footer-grid{grid-template-columns:1fr 1fr;text-align:right}
  .group-title{font-size:24px}
}
@media(max-width:719px){
  .hero-media{aspect-ratio:auto}
  .hero-media img{height:auto}
}
@media(hover:none){.card:hover{transform:none;box-shadow:var(--shadow)}.card:hover .art img,.card:hover .emo{transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <div class="logo" aria-hidden="true">☕</div>
    <div class="brand"><h1>کافه چی</h1><small>منوی دیجیتال</small></div>
    <span class="open-badge">باز است</span>
  </div>
</header>

<main>
  <section class="hero wrap" aria-label="بنر کافه چی">
    <div class="hero-card">
      <div class="hero-text">
        <span class="eyebrow">به کافه چی خوش آمدید</span>
        <h2>لحظه‌ای برای خودت ☀️</h2>
        <p>عطر قهوه، طعم گرم شکلات و حال خوب؛ هر روز از ۶ صبح تا پاسی از شب منتظر شماییم.</p>
        <div class="chips">
          <span class="chip">◷ ۶ صبح تا پاسی از شب</span>
          <a class="chip" href="tel:+09376847442">☎ 09376847442</a>
        </div>
      </div>
      <figure class="hero-media" id="heroMedia">
        <img src="images/banner1.png.jpg" alt="کودکی کنار یک فنجان هات‌چاکلت با خامه در کافه چی" fetchpriority="high">
      </figure>
    </div>
  </section>

  <nav class="menu-nav" aria-label="دسته‌بندی منو">
    <div class="wrap tabs" id="tabs" role="group" aria-label="فیلتر دسته‌بندی منو"></div>
  </nav>

  <section class="menu wrap" aria-live="polite" id="content"></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <p>  تماس با طراح :<a href="tel:+982188776655" aria-label="">09209530124</a></p>
     
    </div>
    <div class="credit">طراحی و توسعه: امیر علی سالخورده</div>
  </div>
</footer>



<script>
// برای افزودن آیتم: یک خط به دسته مربوطه اضافه کنید: ['نام', قیمت, 'نام-فایل-عکس (اختیاری)', 'ایموجی (اختیاری)']
// عکس‌ها داخل پوشه images کنار همین فایل باشند. اگر عکس نبود یا لود نشد، ایموجی نمایش داده می‌شود.
const menu=[
{name:'قهوه',emoji:'☕',items:[
 ['اسپرسو',110000,'1.jpg'],
 ['امریکانو',130000,'2.jpg'],
 ['لاته',190000,'3.jpg'],
 ['کاپوچینو',200000,'4.jpg'],
 ['موکا',210000,'5.jpg'],
 ['کارامل ماکیاتو',210000,'6.jpg'],
 ['هات چاکلت',200000,'7.jpg'],
 ['وایت چاکلت',0,'8.jpg'],
 ['شیر نسکافه',180000,'9.jpg'],
['ماسالا',190000,'10.jpg'],
 ['چای ترک',190000,'11.jpg']]},
{name:'چای و دمنوش',emoji:'🍵',items:[
 ['چای سبز',70000,'12.jpg'],
 ['چای سیاه',40000,'13.jpg'],
 ['گل گاوزبون',70000,'14.jpg'],
 ['گل گاوزبون (مخصوص کافه چی)',100000,'15.jpg'],
 ['به و سیب',0,'16.jpg'],
 ['بابونه',0,'17.jpg'],
 ['چای ترش',0,'18.jpg'],
 ['آویشن',80000,'19.jpg'],
 ['زنجبیل و دارچین',0,'20.jpg']]},
{name:'نوشیدنی سرد',emoji:'🧊',items:[
 ['موهیتو',180000,'21.jpg'],
 ['ردموهیتو',200000,'22.jpg','🍹'],
 ['لیموناد',0,'23.jpg','🍋'],
 ['آیس آمریکانو',150000,'24.jpg'],
 ['آیس لاته',200000,'25.jpg'],
 ['آیس موکا',220000,'26.jpg'],
 ['آیس وانیل',0,'27.jpg'],
 ['آیس کارامل ماکیاتو',205000,'28.jpg'],
 ['آفوگاتو',210000,'29.jpg','🍨'],
 ['آب هویج',220000,'30.jpg','🥕']]},
{name:'شیک',emoji:'🥤',items:[
 ['نوتلا',320000,'31.jpg'],
 ['توت فرنگی',310000,'32.jpg'],
 ['شکلات',310000,'33.jpg'],
 ['موز',290000,'34.jpg'],
 ['موز و کره بادام زمینی',310000,'35.jpg'],
 ['نسکافه',280000,'36.jpg'],
 ['شیک طالبی',280000,'37.jpg'],
 ['شیک موز بستنی',290000,'38.jpg'],
 ['شیر موز',220000,'39.jpg']]},
{name:'بستنی',emoji:'🍦',items:[
['وانیلی',0,'40.jpg'],
['شکلاتی',0,'41.jpg'],
['طالبی',0,'42.jpg'],
['زعفران',0,'43.jpg']]}
].map(c=>({...c,items:c.items.map(([name,price,img='',emoji])=>({
  name,price,img:img?'Images/'+img:'',emoji:emoji||c.emoji}))}));

const $=id=>document.getElementById(id);
const content=$('content'), tabsEl=$('tabs'), header=$('siteHeader');

const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function priceHTML(p){
  return p>0
    ? `<span class="price">${fa(p.toLocaleString('en-US'))}<small>تومان</small></span>`
    : `<span class="price soon">به‌زودی</span>`;
}

function cardHTML(item,index){
  const art=item.img
    ? `<img src="${esc(item.img)}" alt="${esc(item.name)}" loading="lazy" decoding="async">`
    : `<span class="emo" aria-hidden="true">${item.emoji}</span>`;
  return `<article class="card" style="--d:${Math.min(index*40,320)}ms">
    <div class="art" data-emoji="${esc(item.emoji)}">${art}</div>
    <div class="body">
      <h3 class="name">${esc(item.name)}</h3>
      <div class="foot">
        ${priceHTML(item.price)}
        <span class="tag">جدید</span>
      </div>
    </div>
  </article>`;
}

function render(cat='همه'){
  let i=0;
  content.innerHTML=menu.filter(c=>cat==='همه'||c.name===cat).map(c=>`
    <section class="group">
      <div class="group-head">
        <span class="group-icon" aria-hidden="true">${c.emoji}</span>
        <div>
          <h2 class="group-title">${esc(c.name)}</h2>
          <span class="group-count">${fa(c.items.length)} آیتم</span>
        </div>
      </div>
      <div class="grid">${c.items.map(it=>cardHTML(it,i++)).join('')}</div>
    </section>`).join('');
}

// اگر عکس منو لود نشد، ایموجی جایگزین می‌شود
content.addEventListener('error',e=>{
  if(e.target.tagName!=='IMG')return;
  const box=e.target.parentElement;
  box.innerHTML=`<span class="emo" aria-hidden="true">${box.dataset.emoji}</span>`;
},true);

// اگر عکس بنر لود نشد، کادر آن حذف می‌شود و متن بنر تنها می‌ماند
const heroMedia=$('heroMedia');
const heroImg=heroMedia.querySelector('img');
const removeHeroMedia=()=>heroMedia.remove();
heroImg.addEventListener('error',removeHeroMedia);
if(heroImg.complete&&heroImg.naturalWidth===0)removeHeroMedia();

// تب‌ها
const cats=['همه',...menu.map(c=>c.name)];
tabsEl.innerHTML=cats.map((c,i)=>
  `<button class="tab" type="button" data-category="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`
).join('');
tabsEl.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(!tab)return;
  tabsEl.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b===tab)));
  render(tab.dataset.category);
});

addEventListener('scroll',()=>header.classList.toggle('scrolled',scrollY>8),{passive:true});
render();
</script>
</body>
</html>
